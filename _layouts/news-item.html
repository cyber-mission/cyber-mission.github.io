---
layout: default
bodyClass: page-news-single
---

<div class="pt-md-6 pb-md-6 container pb-4 pt-4">
    <div class="row justify-content-start">
        <div class="col-12 col-md-8">
            <div class="blog blog-single">
                <p class="news-subheading">{{ page.type }}{% if page.subheading %} · {{ page.subheading }}{% else %} · {{ page.date | date: "%-d %B %Y" }}{% endif %}</p>
                <h1 class="title">{{ page.title }}</h1>
                <div class="content">{{ content }}</div>
            </div>
        </div>
    </div>
</div>
